name: build-data

# Rebuilds road data from Overpass and commits it. Cities are defined once
# in data/cities.json (shared with the frontend selector).
on:
  push:
    paths:
      - "scripts/build_roads.py"
      - ".github/workflows/build-data.yml"
  workflow_dispatch:
    inputs:
      ids:
        description: "Space-separated city ids to build (empty = all in cities.json)"
        default: ""
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build road GeoJSON
        env:
          # push events carry no inputs — refresh just Taipei for fast feedback
          IDS: ${{ inputs.ids != '' && inputs.ids || (github.event_name == 'push' && 'taipei' || '') }}
        run: |
          python - "$IDS" <<'PY' | tee stats.txt
          import json, subprocess, sys, time
          ids = sys.argv[1].split() if len(sys.argv) > 1 and sys.argv[1].strip() else None
          cities = json.load(open("data/cities.json"))
          if ids:
              cities = [c for c in cities if c["id"] in ids]
          for i, c in enumerate(cities):
              if i:
                  time.sleep(5)  # be polite to Overpass between cities
              print(f"\n===== {c['name']} ({c['id']}) =====", flush=True)
              r = subprocess.run(
                  ["python", "scripts/build_roads.py", "--city", c["osm"], "--out", f"data/{c['file']}"]
              )
              if r.returncode != 0:
                  print(f"!!!!! FAILED {c['id']} (continuing)", flush=True)
          PY

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.geojson
          git diff --cached --quiet && { echo "data unchanged, nothing to commit"; exit 0; }
          git commit -m "data: rebuild road geojson" -m "$(cat stats.txt)"
          git push
